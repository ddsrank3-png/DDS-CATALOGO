function addComboToCart(){
  if(!curCombo || !selTier) return;
  const cid='combo_'+curCombo.id;
  const key=cid+'_'+selTier.ml;
  const found=CART.find(i=>i.key===key);
  if(found) found.qty+=comboQty;
  else CART.push({ key, id:cid, tipo:'combo', nombre:curCombo.nombre, marca:'Combo', categoria:'Promoción', img:imgsOf(curCombo)[0], ml:selTier.ml, precio:selTier.precio, antes:selTier.antes||null, qty:comboQty });
  (curCombo.addons||[]).forEach((a,i)=>{
    if(!selAddons.has(i)) return;
    const akey='addon_'+curCombo.id+'_'+i;
    const f=CART.find(x=>x.key===akey);
    if(f) f.qty+=1;
    else CART.push({ key:akey, id:akey, tipo:'addon', nombre:a.nombre, marca:'Combínalo', img:a.imagen_url||'', ml:a.ml||'', precio:Number(a.precio), antes:Number(a.antes)||null, qty:1 });
  });
  saveCart(); toast(`Añadido: ${curCombo.nombre}`);
  closeProduct(); openCart();
}

/* ================= Carrito ================= */
function addToCart(){
  if(!curProduct || !selSize) return;
  const s = stockDe(curProduct);
  if(s!=null && qtyEnCarrito(curProduct.id) >= s){ toast(s<=0?'Producto agotado':'No hay más stock disponible'); return; }
  const key = curProduct.id + '_' + selSize.size;
  const found = CART.find(i=>i.key===key);
  if(found) found.qty++;
  else CART.push({ key, id:curProduct.id, nombre:curProduct.nombre, marca:curProduct.marca, categoria:curProduct.categoria, img:imgsOf(curProduct)[0], ml:selSize.size, precio:selSize.price, precio_may:selSize.may||0, qty:1 });
  saveCart();
  if(regaloDisponible()) toast('🎁 ¡Ganaste un regalo! Elígelo en tu pedido');
  else toast(`Añadido: ${curProduct.nombre} (${mlLabel(selSize.size)})`);
  closeProduct(); openCart();
}
function saveCart(){ localStorage.setItem('cart_'+CONFIG.TIENDA_NOMBRE, JSON.stringify(CART)); renderCart(); }

/* Agregar un decant de regalo elegido por el cliente */
function addGift(promoId){
  const g = GIFT_STATUS.find(x=>x.promoId===promoId); if(!g) return;
  const chosen = CART.filter(i=>i.tipo==='regalo'&&i.promoId===promoId).length;
  if(chosen>=g.giftsEarned){ toast('Ya elegiste todos tus regalos'); return; }
  const sel=document.getElementById('giftSel_'+promoId);
  const pid = sel ? sel.value : (g.opciones[0]&&g.opciones[0].id);
  const opt = g.opciones.find(o=>o.id===pid); if(!opt){ toast('Elige un perfume'); return; }
  CART.push({ key:'regalo_'+promoId+'_'+pid+'_'+Date.now(), id:'regalo_'+pid, tipo:'regalo', promoId, nombre:opt.nombre, marca:'Regalo', img:opt.img||'', ml:g.ml, precio:0, qty:1 });
  saveCart(); toast('🎁 ¡Regalo agregado: '+opt.nombre+'!');
}
/* ¿Hay un regalo recién disponible para elegir? */
function regaloDisponible(){
  return (GIFT_STATUS||[]).some(g=>{
    const chosen = CART.filter(i=>i.tipo==='regalo'&&i.promoId===g.promoId).length;
    return g.giftsEarned>chosen && g.opciones.length;
  });
}

function mayorBanner(){
  if(!hayMayorEnCarrito()) return '';
  const u=unidadesCarrito(), M=MAYOR_MIN, active=u>=M;
  const lbl=(CONFIG.LABEL_MAYORISTA||'Precio por mayor');
  let txt = active ? `✓ ${lbl} activado`
    : (u===M-1 ? `¡Falta 1! Con un perfume más se activa el ${lbl.toLowerCase()}`
    : `Faltan ${M-u} perfumes para el ${lbl.toLowerCase()}`);
  const pct=Math.min(100, Math.round(u/Math.max(1,M)*100));
  return `<div class="mayor-note ${active?'on':''}">${txt}<div class="bar"><i style="width:${pct}%"></i></div></div>`;
}
function renderCart(){
  const n = CART.reduce((s,i)=>s+i.qty,0);
  const cc=$('#cartCount'); cc.textContent=n; cc.style.display=n?'grid':'none';

  if(!CART.length){
    $('#cartList').innerHTML = `<div class="cart-empty"><b style="font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--cream)">Tu pedido está vacío</b><br>Añade tus fragancias favoritas.</div>`;
    $('#cartBot').style.display='none'; GIFT_STATUS=[]; return;
  }

  let R = window.PROMOS_ENGINE.computeCart(pricedCart(), PROD_BY_ID, PROMOS);
  // Reconciliar regalos: nunca más regalos de los ganados (si bajan los requisitos, se quitan)
  let giftChanged=false;
  (R.regalos||[]).forEach(g=>{
    const gifts = CART.filter(i=>i.tipo==='regalo'&&i.promoId===g.promoId);
    if(gifts.length > g.giftsEarned){
      const sobra = new Set(gifts.slice(g.giftsEarned));
      CART = CART.filter(i=>!sobra.has(i));
      giftChanged=true;
    }
  });
  if(giftChanged){ localStorage.setItem('cart_'+CONFIG.TIENDA_NOMBRE, JSON.stringify(CART)); R = window.PROMOS_ENGINE.computeCart(pricedCart(), PROD_BY_ID, PROMOS); }
  GIFT_STATUS = R.regalos || [];

  const itemsHtml = R.lines.map(i => {
    if(i.tipo==='regalo'){
      return `<div class="ci gift">
        <div class="th">${i.img?`<img src="${esc(i.img)}" alt="">`:'🎁'}</div>
        <div class="info">
          <div class="n">${esc(i.nombre)} <span class="gift-tag">Regalo</span></div>
          <div class="m">${i.ml?esc(mlLabel(i.ml)):''} · GRATIS</div>
        </div>
        <button class="rm" data-rm="${i.key}">Quitar</button>
      </div>`;
    }
    return `<div class="ci">
      <div class="th">${i.img?`<img src="${esc(i.img)}" alt="">`:''}</div>
      <div class="info">
        <div class="n">${esc(i.nombre)}</div>
        <div class="m">${esc(i.marca||'')} · ${mlLabel(i.ml)}</div>
        <div class="pr">${i.unit<i.unitOrig?`<span class="antes" style="color:var(--muted-2);text-decoration:line-through;margin-right:5px">${fmt(i.unitOrig)}</span>`:''}${fmt(i.unit)}${i.promo?` <span style="color:var(--ok);font-size:.72rem">· ${esc(i.promo)}</span>`:''}</div>
        <div class="qty"><button data-dec="${i.key}">−</button><input class="qv" type="number" min="1" inputmode="numeric" data-qset="${i.key}" value="${i.qty}"><button data-inc="${i.key}">+</button></div>
      </div>
      <button class="rm" data-rm="${i.key}">Quitar</button>
    </div>`;
  }).join('');

  const giftHtml = (R.regalos||[]).map(g=>{
    const chosen = CART.filter(i=>i.tipo==='regalo'&&i.promoId===g.promoId).length;
    if(g.giftsEarned>chosen){
      const porElegir=g.giftsEarned-chosen;
      if(g.opciones.length){
        return `<div class="gift-box">
          <div class="gift-h">🎁 ¡Tienes ${porElegir} regalo${porElegir>1?'s':''} por elegir!</div>
          <div class="gift-row">
            <select id="giftSel_${g.promoId}">${g.opciones.map(o=>`<option value="${esc(o.id)}">${esc(o.nombre)}${g.ml?` — ${esc(mlLabel(g.ml))}`:''}</option>`).join('')}</select>
            <button data-giftadd="${g.promoId}">Agregar</button>
          </div>
        </div>`;
      }
      return `<div class="upsell">🎁 ¡Ganaste ${porElegir} regalo${porElegir>1?'s':''}! Pero aún no hay perfumes de regalo configurados. (Admin: marca los perfumes de regalo y que estén visibles.)</div>`;
    }
    if(g.giftsEarned===0 && g.faltan>0){
      const sizeTxt = (g.mls&&g.mls.length)? ' de '+g.mls.map(mlLabel).join('/') : '';
      return `<div class="upsell">🎁 Te falta${g.faltan>1?'n':''} ${g.faltan} decant${g.faltan>1?'s':''}${sizeTxt} para llevarte un regalo: <b>${esc(g.nombre)}</b></div>`;
    }
    return '';
  }).join('');

  $('#cartList').innerHTML = mayorBanner() + itemsHtml + giftHtml
    + (R.upsells.length ? R.upsells.map(u=>`<div class="upsell">🌟 ${esc(u)}</div>`).join('') : '')
    + (R.comboDisc.length ? R.comboDisc.map(c=>`<div class="promo-line">🎁 ${esc(c.nombre)}: −${fmt(c.monto)}</div>`).join('') : '');

  $('#cartList').querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>chgQty(b.dataset.inc,1));
  $('#cartList').querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>chgQty(b.dataset.dec,-1));
  $('#cartList').querySelectorAll('[data-qset]').forEach(inp=>inp.onchange=()=>setQty(inp.dataset.qset, inp.value));
  $('#cartList').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{CART=CART.filter(i=>i.key!==b.dataset.rm); saveCart();});
  $('#cartList').querySelectorAll('[data-giftadd]').forEach(b=>b.onclick=()=>addGift(b.dataset.giftadd));

  const yapeOn = payMethod==='yape' && CONFIG.YAPE_NUMERO;
  $('#cartBot').style.display='block';
  $('#cartBot').innerHTML = `
    <div class="cliente-box">
      <div class="cliente-t">Tus datos <span>(opcional — para registrar tu pedido)</span></div>
      <input id="cNombre" placeholder="Nombre" value="${esc(cliente.nombre||'')}">
      <input id="cTel" placeholder="Teléfono / WhatsApp" inputmode="tel" value="${esc(cliente.tel||'')}">
      <input id="cDir" placeholder="Dirección o referencia (opcional)" value="${esc(cliente.dir||'')}">
    </div>
    ${CONFIG.YAPE_NUMERO ? `<div class="pay-toggle">
      <button class="${payMethod==='yape'?'on':''}" data-pay="yape">Pagar con Yape</button>
      <button class="${payMethod==='coordinar'?'on coord':''}" data-pay="coordinar">Coordinar pago</button>
    </div>`:''}
    ${yapeOn ? `<div class="yape-box">Yape a <b>${esc(CONFIG.YAPE_NUMERO)}</b>${CONFIG.YAPE_NOMBRE?` (<b>${esc(CONFIG.YAPE_NOMBRE)}</b>)`:''} y pega el N° de operación:
      <input id="yapeOp" placeholder="N° de operación" inputmode="numeric"></div>`:''}
    ${R.ahorro>0?`<div class="tot"><span class="k">Subtotal</span><span class="tach">${fmt(R.totalSinDesc)}</span></div>`:''}
    <div class="tot big"><span class="k">Total</span><span class="v">${fmt(R.total)}</span></div>
    ${R.ahorro>0?`<div class="ahorro">Ahorras ${fmt(R.ahorro)} 🎉</div>`:''}
    <button class="wa" id="waCheckout"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.9-1.4A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5c.1-.1.1-.3 0-.4l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.7.7-.9 1.6-.6 2.6.5 1.6 1.6 3 3.2 3.9 2 1.1 3.3 1 4.2.9.6-.1 1.4-.6 1.6-1.2.2-.5.2-1 .1-1.1z"/></svg>Pedir por WhatsApp</button>`;

  $('#cartBot').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{ payMethod=b.dataset.pay; renderCart(); });
  const cmap={cNombre:'nombre',cTel:'tel',cDir:'dir'};
  Object.keys(cmap).forEach(idc=>{ const el=document.getElementById(idc); if(el) el.oninput=()=>{ cliente[cmap[idc]]=el.value; }; });
  $('#waCheckout').onclick = () => checkout(R);
}
function chgQty(key,d){ const i=CART.find(x=>x.key===key); if(!i)return;
  if(d>0){ const p=PROD_BY_ID[i.id]; const s=p?stockDe(p):null; if(s!=null && qtyEnCarrito(i.id)>=s){ toast('No hay más stock disponible'); return; } }
  i.qty+=d; if(i.qty<1)CART=CART.filter(x=>x.key!==key); saveCart(); }
function setQty(key,val){ const i=CART.find(x=>x.key===key); if(!i)return;
  let v=parseInt((''+val).replace(/[^\d]/g,''),10); if(isNaN(v)||v<1)v=1;
  const p=PROD_BY_ID[i.id]; const s=p?stockDe(p):null;
  if(s!=null){ const otros=qtyEnCarrito(i.id)-i.qty; if(otros+v>s){ v=Math.max(1,s-otros); toast('Ajustado al stock disponible'); } }
  i.qty=v; saveCart(); }
function openCart(){ renderCart(); $('#drawer').classList.add('open'); document.body.style.overflow='hidden'; }
function closeCart(){ $('#drawer').classList.remove('open'); document.body.style.overflow=''; }
$('#openCart').onclick = openCart;
document.querySelectorAll('[data-close-cart]').forEach(el=>el.onclick=closeCart);

async function checkout(R){
  if(!CART.length){ toast('Tu pedido está vacío'); return; }
  const nombre=(cliente.nombre||'').trim(), tel=(cliente.tel||'').trim(), dir=(cliente.dir||'').trim();
  const op = ($('#yapeOp')?.value||'').trim();
  const enc = s => encodeURIComponent(s);

  // Registrar la venta (no bloquea el pedido si falla)
  try{
    const items = R.lines.map(i => ({ id:i.id, nombre:i.nombre, marca:i.marca||'', ml:i.ml, qty:i.qty, precio:i.unit, total:i.lineTotal }));
    await sb.from('ventas').insert({
      cliente_nombre:nombre||null, cliente_telefono:tel||null, cliente_direccion:dir||null,
      items, subtotal:R.totalSinDesc, descuento:R.ahorro, total:R.total,
      metodo_pago:payMethod, yape_operacion:(payMethod==='yape'?op:'')||null, estado:'nuevo'
    });
  }catch(e){ console.warn('No se pudo registrar la venta:', e); }

  // Armar mensaje de WhatsApp
  let msg = `¡Hola ${enc(CONFIG.TIENDA_NOMBRE)}! Quiero hacer este pedido:%0A%0A`;
  R.lines.forEach(i => {
    if(i.tipo==='regalo') msg += `• 🎁 ${enc(i.nombre)} — ${enc(mlLabel(i.ml))} x${i.qty} = GRATIS%0A`;
    else msg += `• ${enc(i.nombre)} (${enc(i.marca||'')}) — ${enc(mlLabel(i.ml))} x${i.qty} = ${enc(fmt(i.unit*i.qty))}%0A`;
  });
  if(R.ahorro>0) msg += `%0A🎉 Ahorro: ${enc(fmt(R.ahorro))}`;
  msg += `%0A*Total: ${enc(fmt(R.total))}*`;
  if(nombre||tel||dir){
    msg += `%0A%0A👤 *Mis datos:*%0A${nombre?`Nombre: ${enc(nombre)}%0A`:''}${tel?`Teléfono: ${enc(tel)}%0A`:''}${dir?`Dirección: ${enc(dir)}`:''}`;
  }
  if(payMethod==='yape' && CONFIG.YAPE_NUMERO){
    msg += `%0A%0A💜 Pago por *Yape* a ${enc(CONFIG.YAPE_NUMERO)}${op?`%0AN° de operación: ${enc(op)}`:''}`;
  }
  window.open(`https://wa.me/${CONFIG.WHATSAPP}?text=${msg}`, '_blank');
}

/* ================= Buscador ================= */
$('#q').oninput = e => { query = e.target.value.trim().toLowerCase();
  if(currentView==='promos') renderCombos();
  else if(currentView==='preorden') renderPre();
  else if(currentView==='consolidado') renderCon();
  else render();
};
const _be=$('#btnEstado'); if(_be) _be.onclick = abrirConsulta;
document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeProduct(); closeCart(); } });

/* ================= Pestañas Catálogo / Promociones ================= */
document.querySelectorAll('#viewtabs .vtab').forEach(b => b.onclick = () => setView(b.dataset.view));

let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

renderCart();
load().finally(()=>setTimeout(()=>{ const l=$('#loader'); if(l) l.classList.add('hide'); }, 450));
</script>
